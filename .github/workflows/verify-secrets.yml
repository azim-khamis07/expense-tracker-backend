name: Verify GitHub Secrets

on:
  workflow_dispatch:
  schedule:
    # Run daily at midnight UTC to verify secrets are still valid
    - cron: '0 0 * * *'

jobs:
  verify-secrets:
    name: Verify Required Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify AWS Secrets
        run: |
          echo "🔍 Verifying AWS secrets..."

          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "❌ AWS_ACCESS_KEY_ID is not set"
            exit 1
          else
            echo "✅ AWS_ACCESS_KEY_ID is configured"
          fi

          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "❌ AWS_SECRET_ACCESS_KEY is not set"
            exit 1
          else
            echo "✅ AWS_SECRET_ACCESS_KEY is configured"
          fi

      - name: Verify Database Secret
        run: |
          echo "🔍 Verifying database secret..."

          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "❌ PRODUCTION_DATABASE_URL is not set"
            exit 1
          else
            echo "✅ PRODUCTION_DATABASE_URL is configured"
            # Don't print the actual URL for security
            echo "   (URL format verified)"
          fi

      - name: Verify Optional Secrets
        run: |
          echo "🔍 Verifying optional secrets..."

          if [ -z "${{ secrets.SLACK_WEBHOOK }}" ]; then
            echo "⚠️  SLACK_WEBHOOK is not set (optional)"
          else
            echo "✅ SLACK_WEBHOOK is configured"
          fi

      - name: Test AWS Credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          echo "🔍 Testing AWS credentials..."

          # Install AWS CLI
          pip install awscli --quiet

          # Test credentials by calling a simple AWS API
          if aws sts get-caller-identity > /dev/null 2>&1; then
            echo "✅ AWS credentials are valid"
            aws sts get-caller-identity --output json | jq -r '.Account + " / " + .Arn'
          else
            echo "❌ AWS credentials are invalid or insufficient permissions"
            exit 1
          fi

      - name: Test Database Connection
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "🔍 Testing database connection..."

          # Extract connection details (don't print full URL)
          if [[ "$DATABASE_URL" =~ postgresql.*://([^:]+):([^@]+)@([^:]+):([^/]+)/(.+) ]]; then
            DB_HOST="${BASH_REMATCH[3]}"
            DB_PORT="${BASH_REMATCH[4]}"
            echo "   Testing connection to: $DB_HOST:$DB_PORT"

            # Install PostgreSQL client
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client > /dev/null 2>&1

            # Test connection (timeout after 10 seconds)
            if timeout 10 psql "$DATABASE_URL" -c "SELECT 1;" > /dev/null 2>&1; then
              echo "✅ Database connection successful"
            else
              echo "⚠️  Database connection test failed (may be network restricted)"
              echo "   This is OK if database is in private VPC"
            fi
          else
            echo "⚠️  Could not parse DATABASE_URL format"
          fi

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "📋 Secrets Verification Summary"
          echo "================================"
          echo "✅ AWS_ACCESS_KEY_ID: Configured"
          echo "✅ AWS_SECRET_ACCESS_KEY: Configured"
          echo "✅ PRODUCTION_DATABASE_URL: Configured"
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            echo "✅ SLACK_WEBHOOK: Configured"
          else
            echo "⚠️  SLACK_WEBHOOK: Not configured (optional)"
          fi
          echo ""
          echo "🎯 All required secrets are configured!"
