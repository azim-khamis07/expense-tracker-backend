# Ruff configuration
target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"app/db/base.py" = ["E402"]  # Allow imports after Base definition (needed for Alembic)
"app/db/migrations/versions/*.py" = [
    "UP035",  # Migration files use typing imports
    "I001",  # Import sorting (auto-generated files)
    "UP007",  # Union types (auto-generated files may use old syntax)
]
"app/models/*.py" = ["F821"]  # Forward references in type annotations (valid)

[format]
quote-style = "double"
indent-style = "space"
