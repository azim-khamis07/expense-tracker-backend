[tool.poetry]
name = "expense-tracker"
version = "0.1.0"
description = "Production-grade expense tracking API"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
psycopg2-binary = "^2.9.10"
pydantic-settings = "^2.6.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["argon2"], version = "^1.7.4"}
python-multipart = "^0.0.20"
asyncpg = "^0.30.0"
redis = "^5.2.1"
celery = {extras = ["redis"], version = "^5.6.2"}
boto3 = "^1.35.94"
python-json-logger = "^4.0.0"
email-validator = "^2.3.0"
python-magic = "^0.4.27"
pillow = "^12.1.0"
flower = "^2.0.1"
reportlab = "^4.4.7"
matplotlib = "^3.10.8"
sentry-sdk = {extras = ["fastapi"], version = "^2.49.0"}
psutil = "^6.1.0"
prometheus-client = "^0.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.1"
ruff = "^0.8.6"
black = "^24.10.0"
mypy = "^1.14.0"
types-redis = "^4.6.0.20241004"
faker = "^33.3.0"
pre-commit = "^4.5.1"
pytest-mock = "^3.15.1"
freezegun = "^1.5.5"
locust = "^2.43.0"
safety = "^3.7.0"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "auth: Authentication tests",
    "transactions: Transaction tests",
    "analytics: Analytics tests",
    "reports: Report tests",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
