services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: expense-tracker-db
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: expense-tracker-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # pgAdmin (Database Management Tool)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: expense-tracker-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@expense-tracker.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  # Redis Commander (Redis Management Tool)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: expense-tracker-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  # MinIO (S3-compatible storage for local development)
  minio:
    image: minio/minio:latest
    container_name: expense-tracker-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Celery Worker (Async task processing)
  # NOTE: For local development, run Celery worker directly:
  #   celery -A app.infra.celery_app worker --loglevel=info -Q reports
  # Docker service requires Dockerfile (not included for simplicity)
  # celery-worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   command: celery -A app.infra.celery_app worker --loglevel=info -Q reports
  #   volumes:
  #     - .:/app
  #   depends_on:
  #     - db
  #     - redis
  #   env_file:
  #     - .env
  #   environment:
  #     - CELERY_BROKER_URL=${REDIS_URL}
  #     - CELERY_RESULT_BACKEND=${REDIS_URL}

  # Flower (Celery monitoring)
  # NOTE: For local development, run Flower directly:
  #   celery -A app.infra.celery_app flower --port=5555
  # Docker service requires Dockerfile (not included for simplicity)
  # flower:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   command: celery -A app.infra.celery_app flower --port=5555
  #   ports:
  #     - "5555:5555"
  #   depends_on:
  #     - redis
  #     - celery-worker
  #   env_file:
  #     - .env
  #   environment:
  #     - CELERY_BROKER_URL=${REDIS_URL}
  #     - CELERY_RESULT_BACKEND=${REDIS_URL}

volumes:
  postgres_data:
  redis_data:
  minio_data:
